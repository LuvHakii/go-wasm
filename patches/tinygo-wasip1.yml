id: reflectlite-fieldbyindexerr
language: go
files: [src/internal/reflectlite/value.go]
metadata: { expect: 1 }
rule:
  pattern: 'func (v Value) FieldByIndexErr(index []int) (Value, error) { $$$B }'
fix: |-
  func (v Value) FieldByIndexErr(index []int) (Value, error) {
  	if len(index) == 1 {
  		return v.Field(index[0]), nil
  	}
  	if v.Kind() != Struct {
  		return Value{}, &ValueError{"FieldByIndexErr", v.Kind()}
  	}
  	for i, x := range index {
  		if i > 0 {
  			if v.Kind() == Pointer && v.typecode.elem().Kind() == Struct {
  				if v.IsNil() {
  					return Value{}, nilEmbeddedError{}
  				}
  				v = v.Elem()
  			}
  		}
  		v = v.Field(x)
  	}
  	return v, nil
  }

  type nilEmbeddedError struct{}

  func (nilEmbeddedError) Error() string {
  	return "reflect: indirection through nil pointer to embedded struct field"
  }
