id: os-exec-time-import
language: go
files: [src/os/exec.go]
metadata: { expect: 1 }
rule:
  pattern: |-
    import (
    	"errors"
    	"syscall"
    )
fix: |-
  import (
  	"errors"
  	"syscall"
  	"time"
  )
---
id: os-process-times
language: go
files: [src/os/exec.go]
metadata: { expect: 1 }
rule:
  pattern: |-
    type Process struct {
    	Pid int
    }
fix: |-
  func (p *ProcessState) UserTime() time.Duration { return 0 }

  func (p *ProcessState) SystemTime() time.Duration { return 0 }

  type Process struct {
  	Pid int
  }
---
