id: evalcall-table
language: go
files: [src/text/template/exec.go]
metadata: { expect: 1 }
rule:
  pattern: 'func (s *state) evalCall($$$P) reflect.Value { $$$B }'
fix: |-
  func (s *state) evalCall($$$P) reflect.Value {
  	return s.evalCallSig(dot, fun, isBuiltin, node, name, args, final)
  	$$$B
  }
