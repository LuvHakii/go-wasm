name: build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish release <yyyymmdd-hhmm> UTC. Off = dry run, artifact only, 7 days."
        type: boolean
        default: false
      probe_compile:
        description: "After the build, try cmd/compile with TinyGo (non-gating; reports time, peak memory, size)."
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  ROOT: /home/runner/go-wasm-build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: oven-sh/setup-bun@v2

      - name: bootstrap Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: versions
        run: bun scripts/common.ts >> "$GITHUB_ENV"

      - name: cache native toolchain, modules
        uses: actions/cache@v4
        with:
          path: |
            go/bin
            go/pkg
            ${{ env.ROOT }}/downloads
            ${{ env.ROOT }}/module-cache
          key: go-${{ env.GO_REVISION }}-${{ hashFiles('scripts/setup.ts', 'scripts/common.ts') }}

      - name: install deps
        run: |
          bun install --frozen-lockfile
          bunx --bun playwright install --with-deps chromium

      - name: typecheck
        run: bunx --bun tsc --noEmit

      - name: setup
        run: bun scripts/setup.ts

      - name: build standard-Go tools
        run: bun scripts/build.ts

      - name: "gate: standard-Go dist"
        run: bun test/browser.ts ./dist

      - name: build TinyGo tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/build-tinygo.ts

      - name: "gate: TinyGo dist"
        run: bun test/browser.ts ./dist-tinygo

      - name: stage release
        run: |
          mkdir -p release
          cp dist/*.wasm dist/*.tar dist/tool-manifest.json release/
          tar -cf release/tinygo.tar -C dist-tinygo link.wasm go.wasm asm.wasm gopls.wasm tool-manifest.json
          bun scripts/common.ts --json > release/versions.json
          ls -la release/

      - name: upload dry run
        if: '!inputs.release'
        uses: actions/upload-artifact@v4
        with:
          name: go-wasm-dryrun-${{ github.sha }}
          path: release/
          retention-days: 7

      - name: release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOW=$(date -u +%s)
          TAG=$(date -u -d "@$NOW" +%Y%m%d-%H%M)
          NOTES=$(printf 'Go: %s\nx/tools: %s\nTinyGo: %s\n%s\n' \
            "$GO_REVISION" "$TOOLS_REVISION" "$TINYGO_REVISION" "$(date -u -d "@$NOW" +%FT%TZ)")
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "${GITHUB_SHA::7}" \
            --notes "$NOTES" \
          || gh release upload "$TAG" release/* --clobber

      - name: probe compile with TinyGo
        if: inputs.probe_compile
        continue-on-error: true
        timeout-minutes: 240
        run: bun scripts/probe-compile.ts
